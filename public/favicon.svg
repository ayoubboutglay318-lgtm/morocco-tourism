<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C1272D"/>
      <stop offset="100%" stop-color="#8E1419"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Moroccan 5-Pointed Seal -->
  <g filter="url(#shadow)">
    <!-- Golden Accent Layer -->
    <polygon points="32,10 38.6,23.5 53.8,24.2 42.1,34.2 46,49.2 32,40.7 18,49.2 21.9,34.2 10.2,24.2 25.4,23.5"
             fill="none" stroke="#D4AF37" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Traditional Emerald Green Layer -->
    <polygon points="32,10 38.6,23.5 53.8,24.2 42.1,34.2 46,49.2 32,40.7 18,49.2 21.9,34.2 10.2,24.2 25.4,23.5"
             fill="none" stroke="#007A3D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- Center Star Core -->
  <circle cx="32" cy="30" r="2.2" fill="#D4AF37"/>
</svg>